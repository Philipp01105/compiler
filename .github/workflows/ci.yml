name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DDMM_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DDMM_STRICT_WARNINGS=ON -DDMM_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Safety tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build -L safety --output-on-failure

  fuzzers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure libFuzzer targets
        run: cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DDMM_BUILD_FUZZERS=ON -DBUILD_TESTING=OFF -DDMM_STRICT_WARNINGS=ON
      - name: Build libFuzzer targets
        run: cmake --build build-fuzz --parallel
      - name: Short fuzzing smoke run
        run: |
          for stage in lexer parser semantic ir syntax_converter; do
            mkdir -p "build-fuzz/corpus/$stage"
            if [ -d "tests/fuzz/corpus/$stage" ]; then
              cp -R "tests/fuzz/corpus/$stage/." "build-fuzz/corpus/$stage/"
            fi
            if [ "$stage" != syntax_converter ]; then
              cp tests/execution/generics/*.dmm "build-fuzz/corpus/$stage/"
            fi
            "./build-fuzz/fuzz_$stage" "build-fuzz/corpus/$stage" -dict=tests/fuzz/dmm.dict -max_total_time=5 -timeout=2
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Configure, build, and test
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DDMM_STRICT_WARNINGS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
