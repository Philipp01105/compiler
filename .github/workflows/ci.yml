name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    name: Linux / GCC
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=gcc
          -DDMM_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure


  linux-clang:
    name: Linux / Clang
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=clang
          -DDMM_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure


  linux-sanitizers:
    name: Linux / GCC / ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=gcc
          -DDMM_STRICT_WARNINGS=ON
          -DDMM_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Safety tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build -L safety --output-on-failure


  linux-fuzz:
    name: Linux / Clang / libFuzzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=clang
          -DDMM_BUILD_FUZZERS=ON
          -DBUILD_TESTING=OFF
          -DDMM_STRICT_WARNINGS=ON

      - name: Build fuzzers
        run: cmake --build build --parallel

      - name: Short fuzzing smoke run
        run: |
          for stage in lexer parser semantic ir syntax_converter; do
            mkdir -p "build/corpus/$stage"

            if [ -d "tests/fuzz/corpus/$stage" ]; then
              cp -R "tests/fuzz/corpus/$stage/." "build/corpus/$stage/"
            fi

            if [ "$stage" != syntax_converter ]; then
              find tests/execution/generics \
                -type f \
                -name '*.dmm' \
                -exec cp {} "build/corpus/$stage/" \;
            fi

            "./build/fuzz_$stage" \
              "build/corpus/$stage" \
              -dict=tests/fuzz/dmm.dict \
              -max_total_time=5 \
              -timeout=2
          done


  windows-mingw:
    name: Windows / MinGW GCC
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure, build and test
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DDMM_STRICT_WARNINGS=ON

          cmake --build build --parallel

          ctest \
            --test-dir build \
            --output-on-failure


  windows-clang:
    name: Windows / Clang
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure, build and test
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DDMM_STRICT_WARNINGS=ON

          cmake --build build --parallel

          ctest \
            --test-dir build \
            --output-on-failure